name: Pyroomacoustics Method CI

on:
  push:
    branches:
      - '**'

jobs:
  uv-test:
    name: Pytest for the pyroomacoustics runner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libgl1 mesa-utils

      - name: Run test for pyroomacoustics method
        run: |
          cd pyroomacoustics_method
          uv run --extra tests pytest tests/test_pyroomacoustics_backend.py
