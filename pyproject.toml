[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation_backend"
version = "0.1.0"
requires-python = ">=3.10"
description = "Simulation backend"

dependencies = [
    "gmsh",
    "matplotlib",
]

[project.optional-dependencies]

tests = [
    "pytest",
    "pytest-cov",
    "watchdog",
    "ruff",
    "coverage",
]

docs = [
    "sphinx",
    "autodocsumm>=0.2.14",
    "pydata-sphinx-theme",
    "sphinx_mdinclude",
    "sphinx-design",
    "sphinx-favicon",
    "sphinx-reredirects",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-gallery",
]

dev = ["simulation_backend[tests,docs]"]

[tool.setuptools.packages]
# Turn off automatic package discovery, since we do not specify any packages in this project
# All code is implemented in the sub-packages
find = {namespaces = false}